services:
  api:
    build: .
    command: ["sh", "-c", "uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn document_ingestion.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://documents:documents@postgres:5432/documents
      STORAGE_BACKEND: s3
      S3_BUCKET: documents
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: miniosecret
      QUEUE_BACKEND: rabbitmq
      RABBITMQ_URL: amqp://documents:documents@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["uv", "run", "--no-dev", "document-worker"]
    environment:
      ENVIRONMENT: production
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://documents:documents@postgres:5432/documents
      STORAGE_BACKEND: s3
      S3_BUCKET: documents
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: miniosecret
      QUEUE_BACKEND: rabbitmq
      RABBITMQ_URL: amqp://documents:documents@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: documents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: documents
      RABBITMQ_DEFAULT_PASS: documents
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    expose:
      - "9000"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 minio miniosecret; do sleep 2; done;
      mc mb --ignore-existing local/documents"

volumes:
  postgres-data:
  minio-data:
