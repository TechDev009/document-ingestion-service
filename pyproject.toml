[project]
name = "document-ingestion-service"
version = "0.1.0"
description = "Secure, asynchronous document ingestion and text chunking API"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "AI SaaS Foundation" }]
dependencies = [
  "alembic>=1.14,<2",
  "aio-pika>=9.4,<10",
  "aiosqlite>=0.20,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "markdown-it-py>=3.0,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.24,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.7,<3",
  "pyright>=1.1.390,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.8,<1",
  "testcontainers>=4.9,<5",
]

[project.scripts]
document-worker = "document_ingestion.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_ingestion"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pip-audit>=2.7,<3",
  "pyright>=1.1.390,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.8,<1",
  "testcontainers>=4.9,<5",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "migrations"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
